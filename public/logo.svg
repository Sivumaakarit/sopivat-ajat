<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="headerGrad" x1="16" y1="22" x2="104" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Checkmark Badge Gradient -->
    <linearGradient id="checkGrad" x1="65" y1="65" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow" x="6" y="10" width="108" height="106" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <filter id="badgeShadow" x="62" y="62" width="48" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container with subtle border -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" stroke="white" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Calendar Page Base with Shadow -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="22" width="84" height="78" rx="16" fill="#ffffff"/>
  </g>

  <!-- Calendar Top Colored Header -->
  <path d="M18 36 C18 28.268 24.268 22 32 22 L88 22 C95.732 22 102 28.268 102 36 L102 46 L18 46 Z" fill="url(#headerGrad)"/>

  <!-- Calendar Binder Rings (Hanger tabs) -->
  <!-- Left Ring -->
  <rect x="34" y="14" width="8" height="16" rx="4" fill="#ffffff"/>
  <rect x="36" y="16" width="4" height="12" rx="2" fill="#cbd5e1"/>
  <!-- Right Ring -->
  <rect x="78" y="14" width="8" height="16" rx="4" fill="#ffffff"/>
  <rect x="80" y="16" width="4" height="12" rx="2" fill="#cbd5e1"/>

  <!-- Calendar Grid Lines / Slots -->
  <!-- Row 1 -->
  <circle cx="34" cy="58" r="4.5" fill="#e2e8f0"/>
  <circle cx="50" cy="58" r="4.5" fill="#3b82f6" fill-opacity="0.8"/>
  <circle cx="66" cy="58" r="4.5" fill="#e2e8f0"/>
  <circle cx="82" cy="58" r="4.5" fill="#e2e8f0"/>

  <!-- Row 2 -->
  <circle cx="34" cy="72" r="4.5" fill="#e2e8f0"/>
  <circle cx="50" cy="72" r="4.5" fill="#e2e8f0"/>
  <circle cx="66" cy="72" r="4.5" fill="#3b82f6" fill-opacity="0.8"/>
  
  <!-- Row 3 (partial) -->
  <circle cx="34" cy="86" r="4.5" fill="#e2e8f0"/>
  <circle cx="50" cy="86" r="4.5" fill="#e2e8f0"/>

  <!-- Matching / Fitting Time Checkmark Badge (Bottom Right Accent) -->
  <g filter="url(#badgeShadow)">
    <circle cx="84" cy="84" r="18" fill="url(#checkGrad)"/>
    <circle cx="84" cy="84" r="18" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M76 84.5 L81.5 90 L92.5 78.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
